# manifest.yaml - 纯净模板 (Master Template)
project:
  name: "komari_new"
  version: "v1.3.0"
  description: "Komari 面板服务端，修复了关键的离线通知 Bug，并支持接收和存储来自容器的小数/分数 CPU 核心数据"
  tech_stack: ["Go", "GORM", "SQLite", "gRPC", "Telegram API"]

public_docs:
  features: ["gRPC/Nezha-compat 监控数据采集", "Telegram/Email 离线通知与首次注册提醒", "支持 float64 级别 CPU 核心数记录"]
  usage_guide: "1. 启动服务: ./komari server\n2. 默认数据库: data/komari.db"

private_knowledge:
  dev_logs:
    - date: "2026-05-19"
      type: "patch"
      title: "支持分数/小数 CPU 核心接收，修复 RPC Error -32603"
      issue: "接收 Agent 上报的 0.5 核时，服务端 models.Client.CpuCores 是 int，导致 GORM 写入报错及 RPC -32603 失败，且通知格式化溢出"
      solution: "修改 models.go, modules.go, nezha_compat.go, client.go 将 CpuCores 数据类型改为 float64，数据库列类型适配为 real/double；修改 offline.go 通知逻辑，浮点核心数剔除尾随 .0 兼容常规展示"
    - date: "2026-05-18"
      type: "patch"
      title: "修复离线通知与脚本组件 Bug"
      issue: "Telegram 通知静默失败，消息没有携带基本环境信息，且首次上线连接不会触发 Registered 消息"
      solution: "在 messageSender/loader.go 抛出初始化错误；修改 notify 触发流程，在离线与上线通知中通过 buildClientInfo 组装 IP/CPU/内核等基础环境信息；修复 test.go 中的多个 bug"
  env_mapping: []
  architecture: ["Go", "GORM", "SQLite/MySQL"]

archive:
  current_version: "v1.3.0"
  last_update: "2026-05-19"
  status: "Completed & Verified"
