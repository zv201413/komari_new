name: Notify Komari_ttyd to rebuild

# 后端 push 到 main 后，通知 Komari_ttyd 仓库重建 Docker 镜像。
# 需要在本仓库 Settings -> Secrets 配置 TTYD_DISPATCH_TOKEN（一个对
# zv201413/Komari_ttyd 有 contents:write / actions 权限的 PAT）。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Komari_ttyd build
        run: |
          curl -sfL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.TTYD_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/zv201413/Komari_ttyd/dispatches \
            -d '{"event_type":"upstream-updated","client_payload":{"source":"komari_new","sha":"${{ github.sha }}"}}'
